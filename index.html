<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101117"><title>FRAME / Creator marketplace</title><link rel="stylesheet" href="style.css"></head>
<body>
<aside><a class="logo" href="#library"><span class="mark">F</span> FRAME<span class="dot">®</span></a><div class="workspace-label">YOUR WORKSPACE</div><nav><button data-view="library">▦ <span>Ad marketplace</span></button><button data-view="videos">▷ <span>My videos</span></button><button data-view="projects">▤ <span>Saved projects</span></button></nav><div class="side-bottom"><div class="avatar">JL</div><div><strong id="accountName">Jordan Lee</strong><small id="accountRole">Creator workspace</small></div></div></aside>
<div class="shell"><header><span class="breadcrumb">Workspace <span>/</span> <b id="crumb">Ad marketplace</b></span><button id="switchRole" class="subtle">Switch account</button></header><main id="main"></main><footer>Interactive prototype · Demo accounts · Videos and projects stay in this browser</footer></div>
<dialog id="uploadDialog"><form id="uploadForm"><div class="dialog-head"><h2 id="uploadTitle">Upload video</h2><button type="button" class="icon" data-close="uploadDialog" aria-label="Close">×</button></div><label>Title<input name="title" required maxlength="80" placeholder="Give your video a name"></label><label id="categoryLabel">Category<select name="category"><option>Lifestyle</option><option>Technology</option><option>Travel</option><option>Food & drink</option></select></label><label class="drop">Choose a video file<input type="file" name="file" accept="video/mp4,video/webm,video/quicktime" required><small>MP4 or WebM recommended · Maximum 100 MB</small></label><p id="uploadError" class="error" role="alert"></p><button class="primary" id="uploadSubmit">Upload to workspace</button></form></dialog>
<dialog id="accountDialog"><div class="dialog-head"><h2>Choose a demo account</h2><button class="icon" data-close="accountDialog" aria-label="Close">×</button></div><p>Explore both sides of the marketplace. No password is required in this prototype.</p><button class="account-option" data-role="creator"><span class="avatar">JL</span><span><strong>Jordan Lee</strong><small>Creator · Make videos with brand ads</small></span></button><button class="account-option" data-role="business"><span class="avatar orange">NS</span><span><strong>Northstar Studio</strong><small>Business · Upload and publish video ads</small></span></button></dialog>
<dialog id="previewDialog"><div class="dialog-head"><h2 id="previewTitle">Video preview</h2><button class="icon" data-close="previewDialog" aria-label="Close">×</button></div><video id="quickVideo" controls playsinline></video></dialog><div id="toast" role="status"></div><script type="module" src="app.js"></script></body></html>
